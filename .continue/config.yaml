name: Local Embedded Rust Config
version: 1.0.0
schema: v1

models:
  # Main Chat & Refactoring Model
  - name: Qwen 14B (Main)
    provider: ollama
    model: qwen2.5-coder:14b
    roles: [chat, edit, apply]
    systemMessage: |
      You are an expert Rust systems programmer.
      You have deep knowledge of low-level Rust, unsafe code, embedded systems, 
      and libraries like bilge, embassy, and no_std environments.
      Always prioritize correctness, performance, and idiomatic Rust.
    temperature: 0.3
    contextLength: 16384

  # Reasoning Model (Switch to this for complex borrow-checker battles)
  - name: DeepSeek 16B (Reasoning)
    provider: ollama
    model: deepseek-coder-v2:16b
    roles: [chat]
    temperature: 0.4
    contextLength: 16384

  # Dedicated Autocomplete (Small & Fast)
  - name: Qwen 1.5B (Autocomplete)
    provider: ollama
    model: qwen2.5-coder:1.5b
    roles: [autocomplete]
    temperature: 0.2
    apiBase: http://localhost:11434

  # Local Embeddings for @codebase
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text
    roles: [embed]

rules:
  - name: Rust Best Practices
    rule: |
      - Prefer safe Rust when possible.
      - Use `bilge` bitfields correctly (first field = LSB/MSB awareness).
      - Always consider `no_std` compatibility.
      - Explain `unsafe` blocks thoroughly with // SAFETY: comments.

# Note: Slash commands are now often handled via 'customCommands' 
# or automated by the 'edit' role in 2026.
customCommands:
  - name: explain
    description: Explain this code
    prompt: "Explain the following code in detail, including any potential issues:"
  - name: optimize
    description: Optimize for embedded
    prompt: "Optimize this Rust code for performance and binary size:"

context:
  - provider: currentFile  # This is the one for Alt + Enter / #2
  - provider: file         # This enables @filename
  - provider: codebase     # This enables @codebase search
  - provider: problems     # This enables @problems (very useful for Rust errors)
  - provider: terminal     # This enables @terminal
  - provider: diff         # This enables @diff to see your current git changes

# Global settings (Applied if not overridden in models)
temperature: 0.3
contextLength: 16384